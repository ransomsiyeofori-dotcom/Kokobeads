<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your Kokobeads account password."
    >

    <title>Forgot Password | Kokobeads</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/forgot-password.css"
    >
</head>

<body class="forgot-password-page">

    <header class="forgot-password-header"><div class="forgot-password-header-inner">
        <a
            href="../index.html"
            class="forgot-password-logo"
        >
            Kokobeads
        </a>

        <a
            href="./login.html"
            class="forgot-password-back"
        >
            Back to Login
        </a>
    </div></header>


    <main class="forgot-password-main">

        <section class="forgot-password-card">

            <div class="forgot-password-card-header">

                <div class="forgot-password-icon" aria-hidden="true">
                    🔐
                </div>

                <h1>Forgot Password?</h1>

                <p>
                    Enter the email address associated with your
                    Kokobeads account and we'll send you a link
                    to reset your password.
                </p>

            </div>


            <form
                class="forgot-password-form"
                id="forgotPasswordForm"
                novalidate
            >

                <div class="form-group">

                    <label for="forgotPasswordEmail">
                        Email Address
                    </label>

                    <div class="forgot-password-input-wrapper">

                        <span
                            class="forgot-password-input-icon"
                            aria-hidden="true"
                        >
                            ✉
                        </span>

                        <input class="forgot-password-input"
                            type="email"
                            id="forgotPasswordEmail"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div
                    id="forgotPasswordMessage"
                    class="forgot-password-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    class="forgot-password-button"
                    id="forgotPasswordButton"
                >
                    <span
                        class="forgot-password-button-text"
                    >
                        Send Reset Link
                    </span>

                    <span
                        class="forgot-password-spinner"
                        hidden
                        aria-hidden="true"
                    >
                        ⏳
                    </span>
                </button>

            </form>


            <div class="forgot-password-footer">

                <p>
                    Remember your password?
                    <a href="./login.html">
                        Log in
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="../js/forgotPassword.js"></script>

</body>
</html>
