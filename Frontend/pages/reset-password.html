<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Create a new password for your Kokobeads account."
    >
    <title>Reset Password | Kokobeads</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/forgot-password.css">
</head>

<body class="forgot-password-page">

    <header class="forgot-password-header">
        <div class="forgot-password-header-inner">

            <a
                href="../index.html"
                class="forgot-password-logo"
            >
                Kokobeads
            </a>

            <a
                href="./login.html"
                class="forgot-password-back"
            >
                Back to Login
            </a>

        </div>
    </header>


    <main class="forgot-password-main">

        <section class="forgot-password-card">

            <div class="forgot-password-card-header">

                <div
                    class="forgot-password-icon"
                    aria-hidden="true"
                >
                    🔐
                </div>

                <h1>Reset Password</h1>

                <p>
                    Create a new password for your Kokobeads account.
                </p>

            </div>


            <form
                class="forgot-password-form"
                id="resetPasswordForm"
                novalidate
            >

                <div class="forgot-password-form-group">

                    <label for="resetPassword">
                        New Password
                    </label>

                    <div class="forgot-password-input-wrapper">

                        <span
                            class="forgot-password-input-icon"
                            aria-hidden="true"
                        >
                            🔒
                        </span>

                        <input
                            type="password"
                            id="resetPassword"
                            name="password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="forgot-password-toggle"
                            id="resetPasswordToggle"
                            aria-label="Show password"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <div class="forgot-password-form-group">

                    <label for="resetPasswordConfirm">
                        Confirm Password
                    </label>

                    <div class="forgot-password-input-wrapper">

                        <span
                            class="forgot-password-input-icon"
                            aria-hidden="true"
                        >
                            🔒
                        </span>

                        <input
                            type="password"
                            id="resetPasswordConfirm"
                            name="passwordConfirm"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="forgot-password-toggle"
                            id="resetPasswordConfirmToggle"
                            aria-label="Show password"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <div
                    id="resetPasswordMessage"
                    class="forgot-password-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    class="forgot-password-button"
                    id="resetPasswordButton"
                >

                    <span
                        class="reset-password-button-text"
                    >
                        Reset Password
                    </span>

                    <span
                        class="reset-password-spinner"
                        hidden
                        aria-hidden="true"
                    >
                        ⏳
                    </span>

                </button>

            </form>


            <div class="forgot-password-footer">

                <p>
                    Remember your password?
                    <a href="./login.html">
                        Log in
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="../js/resetPassword.js"></script>

</body>
</html>
